<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="35%" stop-color="#1d559e" />
      <stop offset="70%" stop-color="#113568" />
      <stop offset="100%" stop-color="#091b36" />
    </radialGradient>

    <!-- Center Light Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9dd5ff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#3b8fe8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d559e" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Ribbon Gradients -->
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#60b5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ribbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#99e0ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2575fc" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Light Rays Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Wallpaper -->
  <rect width="1920" height="1080" fill="url(#bg)" />

  <!-- Radiating Light Rays from Center -->
  <g opacity="0.35" filter="url(#softGlow)">
    <polygon points="960,540 700,0 780,0" fill="#aee0ff" />
    <polygon points="960,540 850,0 930,0" fill="#cbeeff" />
    <polygon points="960,540 1000,0 1100,0" fill="#d9f3ff" />
    <polygon points="960,540 1180,0 1260,0" fill="#aee0ff" />
    <polygon points="960,540 1450,150 1520,200" fill="#88cbff" />
    <polygon points="960,540 400,100 480,140" fill="#88cbff" />
    <polygon points="960,540 1600,450 1650,520" fill="#75beff" />
    <polygon points="960,540 280,480 320,550" fill="#75beff" />
  </g>

  <!-- Central Light Pool -->
  <ellipse cx="960" cy="540" rx="550" ry="320" fill="url(#glow)" />

  <!-- Sweeping Harmony Glass Ribbons -->
  <path d="M-100,750 C400,680 750,450 960,520 C1200,600 1500,480 2020,350 L2020,480 C1500,620 1200,720 960,650 C750,580 400,800 -100,880 Z" fill="url(#ribbon1)" />
  <path d="M-100,620 C450,550 800,500 1050,420 C1300,340 1650,420 2020,490 L2020,430 C1650,350 1300,280 1050,350 C800,430 450,480 -100,540 Z" fill="url(#ribbon2)" />

  <!-- Subtle Ambient Bokeh Orbs -->
  <circle cx="820" cy="460" r="14" fill="#ffffff" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="1120" cy="580" r="18" fill="#a2d5ff" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="750" cy="610" r="9" fill="#ffffff" opacity="0.3" />
  <circle cx="1200" cy="480" r="12" fill="#d2eeff" opacity="0.4" />
  <circle cx="920" cy="380" r="7" fill="#ffffff" opacity="0.5" />

  <!-- Windows 7 Center Emblem -->
  <g transform="translate(960, 525) scale(0.95)" filter="url(#softGlow)">
    <!-- Cyan/Blue Pane -->
    <path d="M-38,-38 C-20,-45 -5,-35 15,-40 C15,-20 10,0 12,12 C-5,8 -20,18 -38,12 Z" fill="#00a4ef" opacity="0.85" />
    <!-- Green Pane -->
    <path d="M22,-39 C38,-35 55,-44 72,-37 C70,-18 73,0 71,13 C55,7 38,17 22,12 Z" fill="#7fba00" opacity="0.85" />
    <!-- Yellow Pane -->
    <path d="M22,19 C38,24 55,14 71,19 C73,38 70,58 72,77 C55,70 38,80 22,75 Z" fill="#ffb900" opacity="0.85" />
    <!-- Red Pane -->
    <path d="M-38,18 C-20,24 -5,14 12,20 C10,38 15,58 12,77 C-5,71 -20,81 -38,75 Z" fill="#f25022" opacity="0.85" />
  </g>
</svg>
